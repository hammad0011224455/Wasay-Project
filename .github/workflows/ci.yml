name: CI

on:
  push:
    branches: [ main, work ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai_course_recommender/requirements.txt
          pip install pytest flake8
      - name: Lint
        run: flake8 ai_course_recommender
      - name: Test
        run: pytest
        continue-on-error: true
